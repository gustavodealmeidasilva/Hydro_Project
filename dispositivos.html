<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon/favicon-192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <title>Dispositivos — HydroStats</title>
</head>

<body>
    <div id="shell"></div>
    <main class="main page-main">
        <div class="page-heading">
            <div><span class="page-kicker">Sua instalação</span>
                <h1 class="h3 text-hydro mb-1">Dispositivos</h1>
                <p class="text-muted mb-0">Gerencie os pontos de monitoramento e confira o estado de cada unidade.</p>
            </div><button class="btn btn-hydro" id="add"><i class="bi bi-plus-lg"></i> Adicionar dispositivo</button>
        </div>
        <div id="state"></div>
        <div class="row g-3" id="list"></div>
    </main>
    <div class="modal fade" id="dm" tabindex="-1" aria-labelledby="dmt">
        <div class="modal-dialog">
            <form class="modal-content" id="df" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title h5" id="dmt"></h2><button type="button" class="btn-close"
                        data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3"><label for="dn" class="form-label">Nome</label><input id="dn"
                            class="form-control">
                        <div class="invalid-feedback">Informe o nome.</div>
                    </div>
                    <div><label for="dl" class="form-label">Localização</label><input id="dl" class="form-control">
                        <div class="invalid-feedback">Informe a localização.</div>
                    </div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-outline-secondary"
                        data-bs-dismiss="modal">Cancelar</button><button class="btn btn-hydro">Salvar</button></div>
            </form>
        </div>
    </div>
    <div class="modal fade" id="xm" tabindex="-1" aria-labelledby="xmt">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="xmt">Excluir dispositivo</h2><button type="button" class="btn-close"
                        data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body" id="xb"></div>
                <div class="modal-footer"><button class="btn btn-outline-secondary"
                        data-bs-dismiss="modal">Cancelar</button><button class="btn btn-danger"
                        id="xok">Excluir</button></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/mock-api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dispositivos.js"></script>
</body>

</html>
