<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon/favicon-192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <title>Dashboard — HydroStats</title>
</head>

<body>
  <div id="shell"></div>
  <main class="main page-main" id="main">
    <div class="page-heading">
      <div><span class="page-kicker">Visão geral</span>
        <h1 class="h3 text-hydro mb-1">Dashboard</h1>
        <p class="text-muted mb-0">Acompanhe o fluxo, o consumo por período e a situação do sistema.</p>
      </div>
    </div>
    <div id="state"></div>
    <div id="content" hidden>
      <div class="row g-3 mb-3">
        <div class="col-6 col-xl-3">
          <div class="card p-3 h-100">
            <div class="text-muted">Consumo atual</div>
            <div class="stat"><span id="flow">–</span> <small class="fs-6">L/min</small></div>
            <div id="var" class="small"></div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="card p-3 h-100">
            <div class="text-muted">Consumo hoje</div>
            <div class="stat" id="hoje"></div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="card p-3 h-100">
            <div class="text-muted">Consumo este mês</div>
            <div class="stat" id="mes"></div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="card p-3 h-100">
            <div class="text-muted">Economia estimada</div>
            <div class="stat text-success" id="eco"></div>
          </div>
        </div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-lg-8">
          <div class="card p-3 h-100">
            <div class="d-flex justify-content-between flex-wrap gap-2 mb-2">
              <h2 class="h5">Consumo de água</h2>
              <div class="btn-group btn-group-sm" role="group" aria-label="Período"><button
                  class="btn btn-outline-primary" data-r="hoje">Hoje</button><button
                  class="btn btn-outline-primary active" data-r="7d">7 dias</button><button
                  class="btn btn-outline-primary" data-r="30d">30 dias</button></div>
            </div>
            <div class="chart-box"><canvas id="line" aria-label="Gráfico de consumo" role="img"></canvas></div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card p-3 h-100">
            <h2 class="h5">Status do sistema</h2>
            <ul class="list-unstyled mb-0" id="status"></ul>
          </div>
        </div>
      </div>
      <div class="row g-3">
        <div class="col-lg-7">
          <div class="card p-3 h-100">
            <h2 class="h5 mb-1">Consumo por período</h2>
            <p class="small text-muted mb-2">Últimos 7 dias · hoje em destaque</p>
            <div class="chart-box"><canvas id="bar" aria-label="Comparação entre dias" role="img"></canvas></div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card p-3 h-100">
            <h2 class="h5">Alertas recentes</h2>
            <ul class="list-group list-group-flush" id="alerts"></ul>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>

</html>
