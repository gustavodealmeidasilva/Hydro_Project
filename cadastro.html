<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon/favicon-192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <title>Criar conta — HydroStats</title>
</head>

<body>
    <main class="auth-wrap">
        <div class="auth-card card p-4" style="width:100%;max-width:460px"> <a href="index.html"
                class="brand-stack mb-3" aria-label="HydroStats — página inicial"><img
                    src="assets/logo/logo_sem_texto.png" alt="" height="70"><img src="assets/logo/logo_texto.png"
                    alt="HydroStats" height="52"></a><span class="auth-kicker">Comece por aqui</span>
            <h1 class="auth-title">Crie sua conta</h1>
            <p class="auth-intro">Acesse o painel HydroStats e acompanhe as informações do seu monitoramento.</p>

            <div id="msg" role="alert"></div>
            <form id="f" novalidate>
                <div class="mb-3"><label for="nome" class="form-label">Nome completo</label><input id="nome"
                        class="form-control" autocomplete="name">
                    <div class="invalid-feedback">Informe seu nome completo.</div>
                </div>
                <div class="mb-3"><label for="email" class="form-label">E-mail</label><input id="email" type="email"
                        class="form-control" autocomplete="email">
                    <div class="invalid-feedback">Informe um e-mail válido.</div>
                </div>
                <div class="mb-3"><label for="senha" class="form-label">Senha</label><input id="senha" type="password"
                        class="form-control" autocomplete="new-password">
                    <div class="invalid-feedback">Mínimo de 6 caracteres, com letras e números.</div>
                </div>
                <div class="mb-3"><label for="conf" class="form-label">Confirmar senha</label><input id="conf"
                        type="password" class="form-control" autocomplete="new-password">
                    <div class="invalid-feedback">As senhas não coincidem.</div>
                </div>
                <button class="btn btn-hydro w-100" id="go">Criar conta</button>
            </form>
            <p class="small mt-3 mb-0">Já tem conta? <a href="login.html">Entrar</a></p>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/mock-api.js"></script>
    <script src="js/app.js"></script>
    <script>
        const ok = (el, v) => { el.classList.toggle("is-invalid", !v); return v };
        $("#f").onsubmit = async e => {
            e.preventDefault();
            const n = $("#nome"), em = $("#email"), se = $("#senha"), c = $("#conf");
            const v = [ok(n, n.value.trim().split(/\s+/).length >= 2), ok(em, /^\S+@\S+\.\S+$/.test(em.value)), ok(se, se.value.length >= 6 && /\d/.test(se.value) && /[a-zA-Z]/.test(se.value)), ok(c, c.value === se.value && c.value !== "")];
            if (v.includes(false)) return;
            $("#go").disabled = true;
            try {
                await HydroAPI.register({ nome: n.value.trim(), email: em.value.trim(), senha: se.value });
                $("#msg").innerHTML = '<div class="alert alert-success">Conta criada! Redirecionando para o login...</div>'; setTimeout(() => location.href = "login.html", 1200);
            }
            catch (err) { $("#msg").innerHTML = '<div class="alert alert-danger">' + esc(err.message) + '</div>'; $("#go").disabled = false; }
        };
    </script>
</body>

</html>
