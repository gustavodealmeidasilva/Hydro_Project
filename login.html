<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon/favicon-192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <title>Entrar — HydroStats</title>
</head>

<body>
    <main class="auth-wrap">
        <div class="auth-card card p-4" style="width:100%;max-width:430px"> <a href="index.html"
                class="brand-stack mb-3" aria-label="HydroStats — página inicial"><img
                    src="assets/logo/logo_sem_texto.png" alt="" height="80"><img src="assets/logo/logo_texto.png"
                    alt="HydroStats" height="60"></a><span class="auth-kicker">Monitoramento inteligente</span>
            <h1 class="auth-title">Bem-vindo ao HydroStats</h1>
            <p class="auth-intro">Entre para acompanhar o fluxo e entender melhor o consumo de água.</p>

            <div id="msg" role="alert"></div>
            <form id="f" novalidate>
                <div class="mb-3"><label for="email" class="form-label">E-mail</label><input id="email" type="email"
                        class="form-control" autocomplete="email">
                    <div class="invalid-feedback">Informe um e-mail válido.</div>
                </div>
                <div class="mb-3"><label for="senha" class="form-label">Senha</label><input id="senha" type="password"
                        class="form-control" autocomplete="current-password">
                    <div class="invalid-feedback">A senha deve ter ao menos 6 caracteres.</div>
                </div>
                <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="lembrar"><label
                        class="form-check-label" for="lembrar">Lembrar de mim</label></div>
                <button class="btn btn-hydro w-100" id="go">Entrar</button>
            </form>
            <div class="d-flex justify-content-between mt-3 small"><a href="#" id="forgot">Esqueci minha senha</a><a
                    href="cadastro.html">Criar conta</a></div>
            <p class="small text-muted mt-3 mb-0">Demonstração: demo@hydrostats.com / 123456</p>
        </div>
    </main>
    <div class="modal fade" id="m" tabindex="-1" aria-labelledby="mt">
        <div class="modal-dialog">
            <form class="modal-content" id="rf">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="mt">Recuperar senha</h2><button type="button" class="btn-close"
                        data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body"><label for="re" class="form-label">E-mail cadastrado</label><input id="re"
                        type="email" class="form-control" required></div>
                <div class="modal-footer"><button class="btn btn-hydro">Enviar instruções</button></div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/mock-api.js"></script>
    <script src="js/app.js"></script>
    <script>
        (async () => { if (await HydroAPI.getCurrentUser()) location.replace("dashboard.html"); })();
        const ok = (el, v) => { el.classList.toggle("is-invalid", !v); return v };
        $("#f").onsubmit = async e => {
            e.preventDefault();
            const em = $("#email"), se = $("#senha");
            if (!(ok(em, /^\S+@\S+\.\S+$/.test(em.value)) & ok(se, se.value.length >= 6))) return;
            $("#go").disabled = true; $("#msg").innerHTML = "";
            try { await HydroAPI.login(em.value.trim(), se.value, $("#lembrar").checked); location.href = "dashboard.html"; }
            catch (err) { $("#msg").innerHTML = '<div class="alert alert-danger">' + esc(err.message) + '</div>'; $("#go").disabled = false; }
        };
        const modal = new bootstrap.Modal("#m");
        $("#forgot").onclick = e => { e.preventDefault(); modal.show(); };
        $("#rf").onsubmit = async e => { e.preventDefault(); await HydroAPI.requestPasswordReset($("#re").value); modal.hide(); toast("Se o e-mail existir, enviaremos as instruções."); };
    </script>
</body>

</html>
